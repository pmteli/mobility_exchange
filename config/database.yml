default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  schema_search_path: "public,mobility_exchange"
  variables:
    timezone: UTC
development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/mobility_exchange_development") %>
test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql://localhost/mobility_exchange_test") %>
production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/mobility_exchange_production") %>
