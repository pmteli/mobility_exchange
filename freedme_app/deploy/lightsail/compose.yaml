name: freedme-rails-demo
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: freedme_hosted_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?required}
      APP_DB_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql
      - ./deploy/lightsail/init-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d freedme_hosted_demo']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    image: freedme-rails-demo:latest
    build:
      context: .
      dockerfile: deploy/lightsail/Dockerfile
    env_file: .env.hosted
    environment:
      PRIVACY_BACKUP_DIRECTORY: /var/lib/freedme/backups
    networks:
      default:
      edge:
        aliases: [freedme-rails-preview]
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - uploads:/app/storage
      - privacy_backups:/var/lib/freedme/backups
    restart: unless-stopped
    init: true
  worker:
    image: freedme-rails-demo:latest
    command: [bin/rails, runner, script/journey_worker.rb]
    env_file: .env.hosted
    environment:
      PRIVACY_BACKUP_DIRECTORY: /var/lib/freedme/backups
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - uploads:/app/storage
      - privacy_backups:/var/lib/freedme/backups
    restart: unless-stopped
    init: true
volumes:
  database:
  uploads:
  privacy_backups:

networks:
  edge:
    external: true
    name: freedme-demo_default
